name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Build preview
        run: bun run --filter preview build
        env:
          # Project Pages live at /<repo>/.
          VITE_BASE: /react-map-gl-draw/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/preview/dist

      - id: deployment
        uses: actions/deploy-pages@v5
